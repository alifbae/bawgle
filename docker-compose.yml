# bawgle — production compose.
#
# Pulls the prebuilt multi-arch image from GHCR and joins the shared
# `internal` Docker network so a reverse proxy (Cloudflare Tunnel,
# Traefik, nginx, Caddy) can front it. No host ports exposed.
#
#   docker compose pull && docker compose up -d

services:
  bawgle:
    image: ghcr.io/alifbae/bawgle:latest
    container_name: bawgle
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3001
      BAWGLE_DATA_DIR: /data
    volumes:
      - boggle-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  boggle-data:

networks:
  internal:
    external: true
