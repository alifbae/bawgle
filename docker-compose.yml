# bawgle — single-container multiplayer Boggle.
#
# Pulls the prebuilt image from GHCR and joins the shared `internal`
# Docker network so a reverse proxy fronts it. No host ports exposed.
#
# Required in .env (or shell env):
#   BAWGLE_ADMIN_PASS         — without this, /admin returns 401 for all
#
# Optional in .env (sensible defaults below):
#   BAWGLE_ADMIN_USER         — default `admin`
#   BAWGLE_ALLOWED_ORIGINS    — comma-separated WebSocket origin allowlist
#   PUID / PGID               — default 1000:1000
#   TZ                        — default America/Toronto
#
#   docker compose pull && docker compose up -d

services:
  bawgle:
    image: ghcr.io/alifbae/bawgle:latest
    container_name: bawgle
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
      - BAWGLE_TRUST_PROXY=1
      - BAWGLE_ADMIN_USER=${BAWGLE_ADMIN_USER:-admin}
      - BAWGLE_ADMIN_PASS=${BAWGLE_ADMIN_PASS}
      - BAWGLE_ALLOWED_ORIGINS=${BAWGLE_ALLOWED_ORIGINS}
    volumes:
      - ./data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  internal:
    external: true
