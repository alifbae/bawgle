# bawgle — local dev compose.
#
# Builds the image from the local Dockerfile (so arm64 Macs work without
# waiting on CI), publishes 3001 on the host, and uses a named volume
# scoped to this project so dev data doesn't collide with prod.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml logs -f
#   docker compose -f docker-compose.dev.yml down

services:
  bawgle:
    build: .
    image: bawgle:dev
    container_name: bawgle-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3001
      BAWGLE_DATA_DIR: /data
    ports:
      - "3001:3001"
    volumes:
      - bawgle-dev-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  bawgle-dev-data:
