# bawgle — local dev compose.
#
# Builds from the local Dockerfile so arm64 Macs work without waiting
# on CI, publishes 3001 on the host, and uses a project-local ./data
# dir so dev data doesn't collide with prod.
#
#   docker compose -f docker-compose.dev.yml up -d --build

services:
  bawgle:
    build: .
    image: bawgle:dev
    container_name: bawgle-dev
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Toronto}
      - BAWGLE_ADMIN_USER=${BAWGLE_ADMIN_USER:-admin}
      - BAWGLE_ADMIN_PASS=${BAWGLE_ADMIN_PASS}
      - BAWGLE_ALLOWED_ORIGINS=${BAWGLE_ALLOWED_ORIGINS}
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
